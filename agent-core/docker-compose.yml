services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: quant-agent:local
    environment:
      PORT: 3000
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?DEEPSEEK_API_KEY is required}
      TUSHARE_TOKEN: ${TUSHARE_TOKEN:?TUSHARE_TOKEN is required}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-max}
      PM2_MAX_MEMORY_RESTART: ${PM2_MAX_MEMORY_RESTART:-512M}
      AGENT_DATA_DIR: /data
      RQALPHA_IMAGE: ${RQALPHA_IMAGE:-quant-agent-rqalpha:latest}
      SANDBOX_MAX_CONCURRENT: ${SANDBOX_MAX_CONCURRENT:-8}
      SANDBOX_MEMORY_MB: ${SANDBOX_MEMORY_MB:-256}
      SANDBOX_CPUS: ${SANDBOX_CPUS:-1}
      SANDBOX_TIMEOUT_SECONDS: ${SANDBOX_TIMEOUT_SECONDS:-5}
    volumes:
      - agent_data:/data
      - agent_logs:/var/log/quant-agent
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      agent:
        condition: service_healthy
    restart: unless-stopped

volumes:
  agent_data:
  agent_logs:
